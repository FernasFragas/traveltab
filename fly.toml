# fly.toml app configuration file generated for letsfuckingtravel on 2025-04-06T18:00:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'letsfuckingtravel'
primary_region = 'mad'

[build]

[env]
  DB_PATH = "/data/weatherservice.db"
  # Writers sync: sources last synced before this run again at startup instead of waiting for the
  # monthly window. Set it to a time before the deploy, after changing how posts are picked.
  WRITERS_RESYNC_BEFORE = "2026-10-13T20:00:00Z"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

# Add a mount point for the persistent volume
[mounts]
  source="weather_data_inc" # Name of the volume to be created
  destination="/data"    # Path inside the container where the volume will be mounted

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
